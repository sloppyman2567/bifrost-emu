<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<link rel="canonical" href="$canonical">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="bifrost-emu">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$canonical">
<meta property="og:image" content="$og_image">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="$title">
<meta name="twitter:description" content="$description">
<meta name="twitter:image" content="$og_image">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="${url}icon.svg">
<script type="application/ld+json">$json_ld</script>
<script>
(function () {
  var root = document.documentElement;
  root.classList.add("js");
  try {
    if (localStorage.getItem("side") === "closed" && matchMedia("(min-width: 761px)").matches) root.dataset.side = "closed";
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --text: #17181a; --muted: #5d6166; --line: #e3e3df;
  --accent: #2f6f6a; --accent-text: #ffffff; --code: #f0f0ec;
  --ok: #2e7d4f; --warn: #9a6a12; --bad: #b0413e; --info: #4b5ea8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214; --surface: #18191c; --text: #ececea; --muted: #a2a6ab; --line: #2a2c30;
    --accent: #6fb8b0; --accent-text: #0d1413; --code: #1e2023;
    --ok: #6cc28f; --warn: #d9a84a; --bad: #e37c78; --info: #94a3e8;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, sans-serif;
}
a { color: var(--accent); text-underline-offset: 2px; }
.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); max-width: 1100px; margin: 0 auto; }
.side { position: sticky; top: 0; align-self: start; height: 100vh; overflow: hidden; border-right: 1px solid var(--line); }
.side-in { width: 209px; height: 100%; overflow-y: auto; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-links { display: flex; flex-direction: column; gap: 22px; flex: 1; min-height: 0; }
.content { position: relative; padding: 0 28px; min-width: 0; }
.toggle { display: none; flex: none; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; cursor: pointer;
  color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 6px; }
.toggle:hover { color: var(--text); background: var(--code); }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.toggle svg { width: 18px; height: 18px; display: block; }
.js .toggle { display: inline-flex; }
.toggle.open { position: absolute; top: 12px; left: 28px; opacity: 0; visibility: hidden; }
.brand { display: flex; gap: 10px; align-items: center; white-space: nowrap; font-weight: 650; color: var(--text); text-decoration: none; }
.brand svg { width: 26px; height: 26px; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
/* Closing the sidebar slides it away while the page glides over; nothing animates on first load or for reduced motion. */
.ready .shell { transition: grid-template-columns 0.28s ease; }
.ready .side { transition: border-color 0.28s ease; }
.ready .side-in { transition: opacity 0.2s ease, transform 0.28s ease, visibility 0s; }
.ready .content { transition: padding-top 0.28s ease; }
.ready .toggle.open { transition: opacity 0.2s ease 0.1s, visibility 0s; }
[data-side="closed"] .shell { grid-template-columns: 0 minmax(0, 1fr); }
[data-side="closed"] .side { border-color: transparent; }
[data-side="closed"] .side-in { opacity: 0; visibility: hidden; transform: translateX(-24px); }
.ready [data-side="closed"] .side-in { transition: opacity 0.2s ease, transform 0.28s ease, visibility 0s 0.28s; }
[data-side="closed"] .content { padding-top: 48px; }
[data-side="closed"] .toggle.open { opacity: 1; visibility: visible; }
@media (prefers-reduced-motion: reduce) {
  .ready .shell, .ready .side, .ready .side-in, .ready .content, .ready .toggle.open { transition: none !important; }
}
.side nav a { color: var(--muted); text-decoration: none; font-size: 15px; padding: 5px 10px; margin: 0 -10px;
  border-radius: 6px; }
.side nav a:hover { color: var(--text); }
.side nav a[aria-current="page"] { color: var(--text); background: var(--code); font-weight: 600; }
.side nav.ext a { font-size: 14px; }
.side .small { margin: auto 0 0; }
.hero { padding: 48px 0 40px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(32px, 5vw, 46px); line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 16px; max-width: 760px;
  text-wrap: balance; }
.badge { display: inline-block; font-size: 13px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 3px 10px; margin-bottom: 18px; }
.hero p { font-size: 18px; color: var(--muted); margin: 0 0 26px; max-width: 680px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.button { display: inline-block; padding: 10px 18px; border-radius: 8px; font-weight: 600; text-decoration: none;
  border: 1px solid var(--line); color: var(--text); background: var(--surface); }
.button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 26px; color: var(--muted); font-size: 14px; }
.facts strong { color: var(--text); }
section { padding: 44px 0; border-bottom: 1px solid var(--line); }
section:last-of-type { border-bottom: 0; }
h2 { font-size: 24px; letter-spacing: -0.01em; margin: 0 0 8px; }
.lead { color: var(--muted); margin: 0 0 24px; max-width: 700px; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px 32px; }
.features h3 { font-size: 16px; margin: 0 0 4px; }
.features p { margin: 0; color: var(--muted); font-size: 15px; }
.table { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: fixed; }
.table th:nth-child(1) { width: 36%; } .table th:nth-child(2) { width: 13%; }
.table th:nth-child(3) { width: 13%; } .table th:nth-child(4) { width: 38%; }
.table th { text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  font-weight: 600; padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); }
.table td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
@media (max-width: 640px) { .table { table-layout: auto; } }
.table td.name { font-weight: 600; overflow-wrap: anywhere; }
.table td.kind { color: var(--muted); }
.table td.note { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: " +"; }
details[open] summary::after { content: " \2212"; }
details p { margin: 6px 0 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; font-weight: 600; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.playable { color: var(--ok); } .pill.starts { color: var(--warn); }
.pill.blocked { color: var(--bad); } .pill.tested { color: var(--info); }
.names { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; padding: 0; list-style: none; }
.names li { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 28px; margin: 0 0 28px;
  font-size: 14px; color: var(--muted); }
.legend p { margin: 0; }
.page-head { padding: 40px 0 8px; }
.page-head h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
figure { margin: 0; }
figure img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px;
  border: 1px solid var(--line); display: block; background: var(--code); }
figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto;
  font: 14px/1.55 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; margin: 0 0 16px; }
code { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 0.92em; }
.small { font-size: 14px; color: var(--muted); }
footer { padding: 28px 0 44px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 22px; }
footer a { color: var(--muted); }
@media (max-width: 760px) {
  .shell { display: block; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side-in { width: auto; height: auto; overflow: visible; padding: 14px 20px; gap: 10px; }
  .side-links { gap: 10px; max-height: 120px; overflow: hidden; }
  .ready .side-links { transition: max-height 0.28s ease, opacity 0.2s ease; }
  .side nav { flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
  .side nav a { margin: 0; padding: 3px 8px; }
  .side .small { display: none; }
  .content { padding: 0 20px; }
  .toggle.open { display: none !important; }
  /* On a phone the toggle folds away the links; the brand row stays. */
  [data-side="closed"] .shell { grid-template-columns: none; }
  [data-side="closed"] .side-in { opacity: 1; visibility: visible; transform: none; }
  [data-side="closed"] .side-links { max-height: 0; opacity: 0; }
  [data-side="closed"] .content { padding-top: 0; }
  .table thead { display: none; }
  .table tr { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .table td { display: block; border: 0; padding: 2px 0; }
}
</style>
</head>
<body>
<div class="shell">
<aside class="side" id="side">
 <div class="side-in">
  <div class="side-head">
    <a class="brand" href="$url">$icon bifrost-emu</a>
    <button class="toggle close" type="button" aria-controls="side-links" aria-expanded="true" aria-label="Hide sidebar" title="Hide sidebar">$panel</button>
  </div>
  <div class="side-links" id="side-links">
  <nav aria-label="Site">$nav</nav>
  <nav class="ext" aria-label="Project">
    <a href="$repo">Source</a>
    <a href="$repo/blob/main/Docs/CHANGELOG.md">Changelog</a>
    <a href="$repo/blob/main/Docs/roadmap.md">Roadmap</a>
    <a href="$repo/blob/main/Docs/Android/ANDROID_RUNTIME.md">Android runtime</a>
    <a href="$repo/issues">Issues</a>
  </nav>
  <p class="small">Version $version<br>Unlicense</p>
  </div>
 </div>
</aside>
<div class="content">
<button class="toggle open" type="button" aria-controls="side" aria-expanded="false" aria-label="Show sidebar" title="Show sidebar">$panel</button>
<main>
$main</main>
</div>
</div>
<script>
(function () {
  var root = document.documentElement;
  var closers = document.querySelectorAll(".toggle");
  function set(closed) {
    if (closed) root.dataset.side = "closed"; else delete root.dataset.side;
    for (var i = 0; i < closers.length; i++) closers[i].setAttribute("aria-expanded", closed ? "false" : "true");
    var phone = matchMedia("(max-width: 760px)").matches;
    if (!phone) { try { localStorage.setItem("side", closed ? "closed" : "open"); } catch (e) {} }
  }
  for (var i = 0; i < closers.length; i++) closers[i].addEventListener("click", function () { set(root.dataset.side !== "closed"); });
  if (root.dataset.side === "closed") set(true);
  setTimeout(function () { root.classList.add("ready"); }, 50);
})();
</script>
</body>
</html>
